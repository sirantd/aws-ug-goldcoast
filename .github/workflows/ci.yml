name: CI

# Pull requests only. A `push` trigger as well would run this twice for every
# commit on a branch that has a PR open — same commit, same result, double the
# minutes. Pushes to main are covered by the Deploy workflow, which type-checks
# and builds before it publishes.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
