name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC only — the deploy role is assumed with a short-lived token, so there are
# no AWS keys stored on the repository.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: production

    env:
      # Empty until `terraform apply` has run and the repository variables are
      # set — see infra/README.md. Until then the build still runs and the
      # publish steps are skipped rather than failing red.
      CONFIGURED: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # TEMPORARY: prints the OIDC subject so the IAM trust policy can be
      # matched against it. Prints claims only, never the token itself.
      - name: Debug OIDC claims
        if: env.CONFIGURED == 'true'
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ('sub', 'aud', 'repository', 'ref', 'environment', 'workflow_ref'):
              print(f"{k} = {claims.get(k)!r}")
          PY

      - name: Assume deploy role
        if: env.CONFIGURED == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-deploy-${{ github.run_id }}

      # Fingerprinted assets first, so every object a new page references is in
      # place before the HTML that points at it goes live.
      - name: Upload immutable assets
        if: env.CONFIGURED == 'true'
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --no-progress \
            --exclude '*' --include '_astro/*' \
            --cache-control 'public, max-age=31536000, immutable'

      # Then the HTML and root-level files, pruning anything no longer built.
      # `_astro/` is excluded from the prune: a visitor mid-navigation may still
      # be fetching assets referenced by the previous build.
      - name: Upload pages
        if: env.CONFIGURED == 'true'
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --no-progress --delete \
            --exclude '_astro/*' \
            --cache-control 'public, max-age=300, must-revalidate'

      - name: Invalidate CloudFront
        if: env.CONFIGURED == 'true'
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"

      - name: Summary
        run: |
          if [ "$CONFIGURED" = 'true' ]; then
            {
              echo "### Deployed"
              echo
              echo "- commit: \`${GITHUB_SHA::7}\`"
              echo "- bucket: \`${{ vars.S3_BUCKET }}\`"
              echo "- distribution: \`${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Build succeeded, publish skipped"
              echo
              echo "The AWS infrastructure has not been provisioned yet, so there is"
              echo "nowhere to publish to. Follow \`infra/README.md\`, then set these"
              echo "as repository variables:"
              echo
              echo '- `AWS_DEPLOY_ROLE_ARN`'
              echo '- `AWS_REGION`'
              echo '- `S3_BUCKET`'
              echo '- `CLOUDFRONT_DISTRIBUTION_ID`'
              echo
              echo "Deploys start on the next push to \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
